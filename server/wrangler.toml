name = "senior-resource-map-api"
main = "src/worker.js"
compatibility_date = "2026-03-12"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env", "global_fetch_strictly_public"]
workers_dev = true
routes = [
  { pattern = "api.carearound.sg", custom_domain = true }
]

[version_metadata]
binding = "CF_VERSION_METADATA"

[triggers]
# The handler does no database work until SUPPORT_INBOX_ENABLED is true.
# User category preferences remain opt-in after the approved production rollout.
crons = ["* * * * *"]

[vars]
NODE_ENV = "production"
SUPPORT_INBOX_ENABLED = "true"
GOVERNED_PILOT_RELEASE_STAGE = "off"
VITE_GOOGLE_CLIENT_ID = "828767964064-70irissq9d39beh2i7sc3strs1fvjmpk.apps.googleusercontent.com"
ALLOWED_ORIGINS = "http://localhost:5173,https://senior-resource-map.pages.dev,https://app.carearound.sg"
AI_IMPORT_PROVIDER = "gemini"
GEMINI_API_MODEL = "gemini-3.1-flash-lite"
GROUNDED_AI_ENABLED = "false"
GUIDE_CHAT_ENABLED = "true"
GUIDE_SEMANTIC_RETRIEVAL_ENABLED = "true"

GUIDE_ACTIONS_ENABLED = "true"
GUIDE_AI_GATEWAY_ID = "carearound-guide"
GUIDE_LLM_PILOT_ENABLED = "true"
GUIDE_CONVERSATIONAL_ANSWERS_ENABLED = "true"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "MAP_CACHE"
id = "2a6899a5a6a5440590166ab8e1d3a2d8"

# Shared approved pilot: never create a second counter or reset this allowance.
# After its fixed expiry, reviewed help and server-owned account/actions remain.
[[durable_objects.bindings]]
name = "GUIDE_PILOT_BUDGET"
class_name = "GuidePilotBudget"
script_name = "carearound-guide-account-acceptance"

# Private owner CMS storage. Provision this dedicated bucket before activating
# HELP_CMS_ENABLED; drafts and revision history never use public map storage.
[[r2_buckets]]
binding = "HELP_CMS_BUCKET"
bucket_name = "carearound-help-content-private"
