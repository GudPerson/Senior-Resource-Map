name: CareAround quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use repository Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run credential-free quality gate
        run: npm run verify:quality

      - name: Install browser for Care Map download verification
        run: npx playwright install --with-deps chromium

      - name: Verify Care Map notes and images downloads
        run: node tests/browser/care-map-notes-export.mjs --out=output/care-map-notes-export-browser

      - name: Retain Care Map download evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: care-map-notes-export-browser
          path: output/care-map-notes-export-browser
          if-no-files-found: ignore
