name: CareAround quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-quality:
    # Keep the runner on an OS supported by the locked Playwright release.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use repository Node runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        # Reuse lockfile-verified cache entries and fail promptly if npm is down.
        run: npm ci --prefer-offline --fetch-retries=1 --fetch-timeout=20000

      - name: Run credential-free quality gate
        run: npm run verify:quality

      - name: Install browser for Care Map download verification
        run: npx playwright install --with-deps chromium

      - name: Verify map-first entry and responsive controls
        run: node tests/browser/map-first-entry.mjs --out=output/map-first-entry-browser

      - name: Verify Care Map notes and images downloads
        run: node tests/browser/care-map-notes-export.mjs --out=output/care-map-notes-export-browser

      - name: Verify independent Care Map image allowances
        run: node tests/browser/care-map-image-allowance.mjs --out=output/care-map-image-allowance-browser

      - name: Verify Care Map photo compression
        run: node tests/browser/care-map-photo-compression.mjs --out=output/care-map-photo-compression-browser

      - name: Retain map-first entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-first-entry-browser
          path: output/map-first-entry-browser
          if-no-files-found: ignore

      - name: Retain Care Map photo compression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: care-map-photo-compression-browser
          path: output/care-map-photo-compression-browser
          if-no-files-found: ignore

      - name: Retain Care Map image allowance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: care-map-image-allowance-browser
          path: output/care-map-image-allowance-browser
          if-no-files-found: ignore

      - name: Retain Care Map download evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: care-map-notes-export-browser
          path: output/care-map-notes-export-browser
          if-no-files-found: ignore
