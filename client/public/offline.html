<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0fa39a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareAround SG offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4fbfa;
        color: #0f172a;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 480px);
        border: 1px solid #b7e4df;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 20px 48px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }
      img {
        width: 56px;
        height: 56px;
        display: block;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.6rem;
        line-height: 1.2;
      }
      p {
        margin: 0;
        color: #475569;
        font-size: 1rem;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        margin-top: 20px;
        color: #0f766e;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>CareAround SG needs a connection to load resources, maps, and saved directories. Reconnect, then open the app again.</p>
      <a href="/discover">Try Discover</a>
    </main>
  </body>
</html>
